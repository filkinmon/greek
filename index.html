const L=[
[0,'Алфавит',`<p>В греческом <b>24 буквы</b>. Читается почти всегда так, как пишется: зная буквы, вы прочтёте любое слово. У каждой буквы есть заглавная и строчная форма; с заглавной пишут имена и начало предложения.</p>${tbl(0)}<h4>Что нужно запомнить</h4><ul>
<li><b>Три буквы дают звук «и»:</b> η, ι, υ. Различать их придётся по написанию слова, поэтому учите слова целиком: ήλιος (солнце), ίδιος (тот же), ύπνος (сон).</li>
<li><b>Две буквы дают звук «о»:</b> ο и ω: όχι (нет), ώρα (час).</li>
<li><b>γ</b> перед звуками «е» и «и» (ε, αι, η, ι, ει, οι, υ) читается как «й»: γεια [я] — привет. В остальных случаях это мягкий «г», как в украинском: γάλα [гала] — молоко.</li>
<li><b>δ</b> — звонкий межзубный звук: кончик языка между зубами, как в англ. <i>this</i>. <b>θ</b> — тот же звук, но глухой, как в англ. <i>thin</i>.</li>
<li><b>σ</b> пишется в начале и середине слова, <b>ς</b> — только в конце: σπίτι, φίλος.</li>
<li><b>β</b> всегда читается «в» (не «б»); <b>ρ</b> раскатистое; <b>ξ</b> = «кс», <b>ψ</b> = «пс».</li></ul>

[0,'Дифтонги и ударение',`<p><b>Дифтонг</b> — две гласные, которые читаются как один звук. Сочетания согласных (μπ, ντ, γκ, γγ, τσ, τζ) тоже дают особые звуки. Всё это нужно выучить как отдельные «буквы»:</p>${tbl(1)}<h4>Правила</h4><ul>
<li><b>αυ и ευ</b> читаются «аф, эф» перед глухими согласными (κ, π, τ, φ, χ, σ, ξ, ψ, θ) и «ав, эв» перед гласными и звонкими: αυτός [афтос] — он, αύριο [аврио] — завтра.</li>
<li><b>Две точки над ι или υ</b> (ϊ, ϋ) отменяют дифтонг: παϊδάκια [па-идакья] читается раздельно.</li>
<li><b>Ударение</b> (´) ставится только над гласной. В односложных словах его нет (και, να, με). В остальных оно обязательно и падает на один из трёх последних слогов: κα-λη-μέ-ρα. Ударный слог произносите чуть громче и дольше.</li>
<li>В дифтонге ударение стоит над второй гласной: παιδί, είναι.</li>

[1,'Род и артикли',`<p>В греческом три рода: <b>мужской, женский, средний</b>. Род определяет артикль и форму прилагательного. Учите существительное сразу с артиклем: ο φίλος, а не просто φίλος.</p>${tbl(2)}<h4>Как угадать род по окончанию</h4><ul>
<li><b>-ος</b> — обычно мужской: ο φίλος (друг), ο δρόμος (дорога). Исключения: η οδός (улица) — женский.</li>
<li><b>-ας, -ης</b> — мужской: ο πατέρας (отец), ο μαθητής (ученик).</li>
<li><b>-α, -η</b> — обычно женский: η μητέρα (мать), η ημέρα (день), η πόλη (город).</li>
<li><b>-ι, -ο, -μα</b> — средний: το παιδί (ребёнок), το βιβλίο (книга), το όνομα (имя).</li></ul>
<h4>Важно</h4><ul>
<li>Артикль в греческом употребляется чаще, чем в русском: Το νερό είναι κρύο — вода холодная.</li>
<li>Неопределённый артикль только в единственном числе: ένα βιβλίο — книга, но βιβλία — книги.</li>
<li>Во множественном числе мужской и женский род имеют общий артикль <b>οι</b>, средний — <b>τα</b>.</li></ul>
<h4>Примеры</h4><div class="ex">ο φίλος — друг · η φίλη — подруга · το παιδί — ребёнок · οι φίλοι — друзья · τα παιδιά — дети</div>`,

[1,'Местоимения и глагол είμαι','Личные местоимения: εγώ (я), εσύ (ты), αυτός / αυτή / αυτό (он / она / оно), εμείς (мы), εσείς (вы), αυτοί (они). Местоимения часто опускают, потому что окончание глагола и так показывает лицо. Глагол <b>быть</b>: είμαι, είσαι, είναι, είμαστε, είστε, είναι. Отрицание: <b>δεν</b> перед глаголом: δεν είμαι.',

[1,'Падежи: именительный, винительный, родительный',`<p>Падеж показывает роль слова в предложении. Основных падежей три (звательный — в модуле 3): <b>именительный</b> (кто? что? — подлежащее), <b>винительный</b> (кого? что? — дополнение и слово после предлога), <b>родительный</b> (чей? кого? — принадлежность). Дательного падежа нет: его заменяют <b>σε + винительный</b> или родительный.</p>${tbl(3)}<h4>Примеры</h4><ul>
<li>Ο φίλος βλέπει τον δάσκαλο. — Друг видит учителя. (Им. → Вин.)</li>
<li>Το σπίτι του φίλου είναι μεγάλο. — Дом друга большой. (Род.)</li>
<li>Η μητέρα της Μαρίας είναι εδώ. — Мать Марии здесь. (Род.)</li></ul>
<h4>Что запомнить</h4><ul>
<li>У женского и среднего рода винительный совпадает с именительным. Меняется только мужской род (-ος → -ο), а у всех родов меняется артикль: ο → <b>τον</b>, η → <b>τη(ν)</b>, το → το.</li>
<li>В <b>τον</b> буква ν остаётся всегда. В <b>τη(ν)</b> она отпадает перед большинством согласных: τη μητέρα, τη θάλασσα. Сохраняется перед гласными и перед κ, π, τ, ξ, ψ, μπ, ντ, γκ, τσ, τζ: την ώρα, την πόρτα.</li>
<li>Прилагательное меняется вместе с существительным: ο καλός φίλος → τον καλό φίλο → του καλού φίλου.</li>
<li>Ударение иногда сдвигается: ο άνθρωπος → του ανθρώπου.</li></ul>`,
 [['Винительный: ο φίλος →','τον φίλο'],['Винительный: η γυναίκα →','τη γυναίκα|την γυναίκα'],['Родительный: ο φίλος →','του φίλου'],['Родительный: η γυναίκα →','της γυναίκας'],['Родительный: το παιδί →','του παιδιού'],['Винительный: хорошего друга (καλός φίλος) →','τον καλό φίλο']]],
[1,'Настоящее время: I и II спряжение','<b>I спряжение</b> (ударение на основе): γράφω, γράφεις, γράφει, γράφουμε, γράφετε, γράφουν. <b>II спряжение</b> (ударение на окончании): αγαπάω, αγαπάς, αγαπάει, αγαπάμε, αγαπάτε, αγαπάνε (также αγαπώ, αγαπά, αγαπούν). Чтобы спрягать, отбросьте -ω и добавьте окончание нужного лица.',

[1,'Простое прошедшее (аорист)','Аорист — законченное действие в прошлом. Окончания: -α, -ες, -ε, -αμε, -ατε, -αν. Основа меняется: γράφω → <b>έγραψα</b> (ударение на основе, поэтому добавляется έ-), έγραψες, έγραψε, γράψαμε (ударение сместилось, έ- нет), γράψατε, έγραψαν. II спряжение: αγαπάω → αγάπησα. Ещё: διαβάζω → διάβασα, παίζω → έπαιξα.',

[2,'Звательный падеж','Звательный — это обращение. Мужской род на -ος получает <b>-ε</b>: φίλος → <b>φίλε!</b>; имена на -ης теряют -ς: Γιάννης → <b>Γιάννη!</b>. Женский и средний род не меняются: Μαρία!, παιδί!. Исключение: κύριος → <b>κύριε</b>. Мужские <b>имена</b> на -ος обычно получают <b>-ο</b>: Νίκος → <b>Νίκο</b>, Γιώργος → Γιώργο. Слова и имена на -ας теряют -ς: Κώστας → <b>Κώστα</b>, πατέρας → πατέρα.',

[2,'Прошедшие времена','<b>Παρατατικός</b> — длительное или повторяющееся действие: έγραφα, έγραφες, έγραφε, γράφαμε, γράφατε, έγραφαν («писал, писала»). <b>Παρακείμενος</b> — результат: <b>έχω γράψει</b> (я написал). <b>Υπερσυντέλικος</b> — «раньше, чем другое прошедшее»: <b>είχα γράψει</b>. Форма γράψει не изменяется, меняется только έχω / είχα (έχω, έχεις, έχει, έχουμε, έχετε, έχουν).',

[2,'Будущее время и υποτακτική','Будущее образуется с частицей <b>θα</b>. <b>Длительное</b> (процесс, повторение): θα + настоящее: θα γράφω («буду писать»). <b>Мгновенное</b> (однократное, результат): θα + υποτακτική аориста: θα γράψω («напишу»). <b>Υποτακτική</b> — это форма после <b>να</b> («чтобы», «что делать»): θέλω να γράψω (хочу написать). Её формы совпадают с основой аориста с окончаниями настоящего: γράψω, γράψεις, γράψει, γράψουμε, γράψετε, γράψουν.',
 [['Длительное: я буду писать','θα γράφω'],['Мгновенное: я напишу','θα γράψω'],['Мгновенное: ты напишешь','θα γράψεις'],['Я хочу написать: θέλω ___ γράψω','να'],['Хочу, чтобы ты написал: θέλω να ___','γράψεις']]],
[2,'Пассивный залог','Пассив — подлежащее испытывает действие. Настоящее: γράφομαι, γράφεσαι, γράφεται, γραφόμαστε, γράφεστε, γράφονται (ударение смещается в 1 л. мн. ч.). Аорист: γράφτηκα, γράφτηκες, γράφτηκε, γραφτήκαμε, γραφτήκατε, γράφτηκαν. Будущее: θα γραφτεί («будет написано»).',

[2,'Условные предложения и причастия','<b>Реальное условие:</b> αν + настоящее или аорист, θα + будущее: Αν έχω χρόνο, θα έρθω. <b>Нереальное:</b> αν + имперфект, θα + имперфект: Αν είχα χρόνο, θα ερχόμουν. <b>Деепричастие</b> (одно слово, не изменяется): γράφω → <b>γράφοντας</b> («пиша»), κάνω → κάνοντας, λέω → <b>λέγοντας</b>. <b>Причастие</b> страдательное: γραμμένος, -η, -ο («написанный»).',

[3,'Косвенная речь','Слова-связки: <b>ότι</b> — «что» (Λέει ότι θα έρθει — говорит, что придёт); <b>αν</b> — «ли» (Ρώτησε αν θα έρθεις); вопросительные слова сохраняются (πού, πότε, τι). <b>Να</b> — приказ или просьба: Μου είπε να έρθω (велел мне прийти). Время глагола в косвенной речи обычно остаётся таким же, как в прямой.',

[3,'Предлоги и падежи','После предлогов <b>από, με, για, χωρίς, προς, μέχρι</b> ставится винительный: από τον φίλο, με τη μητέρα. Предлог <b>σε</b> («в, на, к») сливается с артиклем: σε + τον = <b>στον</b>, σε + τη(ν) = <b>στη(ν)</b>, σε + το = <b>στο</b>, σε + τους = <b>στους</b>.',

9:Q(`διαβάζω → παρατατικός, я=διάβαζα\nπαίζω → παρατατικός, ты=έπαιζες\nδιαβάζω → παρατατικός, он=διάβαζε\nπαίζω → παρατατικός, мы=παίζαμε\nδιαβάζω → παρατατικός, они=διάβαζαν\nγράφω → παρατατικός, он=έγραφε\nγράφω → παρατατικός, мы=γράφαμε\nПαρακείμενος: я прочитал (διαβάζω)=έχω διαβάσει\nПαρακείμενος: ты прочитал (διαβάζω)=έχεις διαβάσει\nПαρακείμενος: он поиграл (παίζω)=έχει παίξει\nПαρακείμενος: вы купили (αγοράζω)=έχετε αγοράσει\nПαρακείμενος: они поговорили (μιλάω)=έχουν μιλήσει\nΥπερσυντέλικος: ты написал (γράφω)=είχες γράψει\nΥπερσυντέλικος: мы поговорили (μιλάω)=είχαμε μιλήσει\nΥπερσυντέλικος: они купили (αγοράζω)=είχαν αγοράσει`),
10:Q(`Длительное: я буду читать (διαβάζω)=θα διαβάζω\nДлительное: ты будешь играть (παίζω)=θα παίζεις\nДлительное: он будет писать (γράφω)=θα γράφει\nДлительное: мы будем говорить (μιλάω)=θα μιλάμε\nМгновенное: я прочитаю (διαβάζω)=θα διαβάσω\nМгновенное: ты сыграешь (παίζω)=θα παίξεις\nМгновенное: он купит (αγοράζω)=θα αγοράσει\nМгновенное: мы поговорим (μιλάω)=θα μιλήσουμε\nМгновенное: вы напишете (γράφω)=θα γράψετε\nМгновенное: они купят (αγοράζω)=θα αγοράσουν\nМгновенное: я куплю (αγοράζω)=θα αγοράσω\nЯ хочу прочитать: θέλω ___ διαβάσω=να\nТы хочешь поиграть: θέλεις να ___ (παίζω)=παίξεις\nМы хотим поговорить: θέλουμε να ___ (μιλάω)=μιλήσουμε\nОни хотят купить: θέλουν να ___ (αγοράζω)=αγοράσουν`),
11:Q(`διαβάζομαι (читаться) → ты=διαβάζεσαι\nδιαβάζομαι → он=διαβάζεται\nδιαβάζομαι → мы=διαβαζόμαστε\nδιαβάζομαι → вы=διαβάζεστε\nδιαβάζομαι → они=διαβάζονται\nαγοράζομαι (покупаться) → ты=αγοράζεσαι\nαγοράζομαι → он=αγοράζεται\nαγοράζομαι → мы=αγοραζόμαστε\nαγοράζομαι → они=αγοράζονται\nγράφομαι → вы=γράφεστε\nАорист пассива: γράφομαι → ты=γράφτηκες\nАорист пассива: γράφομαι → он=γράφτηκε\nАорист пассива: γράφομαι → они=γράφτηκαν\nАорист пассива: γράφομαι → мы=γραφτήκαμε\nАорист пассива: γράφομαι → вы=γραφτήκατε`),
12:Q(`Если ты прочитаешь, ты узнаешь: Αν διαβάσεις, ___ μάθεις=θα\nЕсли пойдёт дождь, я останусь дома: Αν ___ βρέξει, θα μείνω σπίτι=αν\nЕсли бы я был богат: Αν ___ πλούσιος, θα ταξίδευα (быть, имперфект)=ήμουν\nЕсли бы у меня были деньги: Αν είχα χρήματα, ___ αγόραζα σπίτι=θα\nЕсли бы у тебя было время: Αν ___ χρόνο, θα ερχόσουν (έχω, имперфект)=είχες\nЕсли придёшь, я буду рад: Αν έρθεις, ___ χαρώ=θα\nδιαβάζω → деепричастие=διαβάζοντας\nπαίζω → деепричастие=παίζοντας\nμιλάω → деепричастие=μιλώντας\nαγαπάω → деепричастие=αγαπώντας\nπεριμένω → деепричастие=περιμένοντας\nαγοράζω → деепричастие=αγοράζοντας\nλέω (говорить) → деепричастие=λέγοντας\nПричастие (м. р.) от κλείνω (закрывать): закрытый=κλεισμένος\nПричастие (м. р.) от αγαπάω: любимый=αγαπημένος\nПричастие (м. р.) от κουράζω (утомлять): уставший=κουρασμένος`),
13:Q(`Я говорю, что у меня всё хорошо: Λέω ___ είμαι καλά=ότι\nЯ знаю, что ты здесь: Ξέρω ___ είσαι εδώ=ότι\nЯ думаю, что будет дождь: Νομίζω ___ θα βρέξει=ότι\nЯ спрашиваю, есть ли у тебя время: Ρωτάω ___ έχεις χρόνο=αν\nЯ не знаю, придёт ли он: Δεν ξέρω ___ θα έρθει=αν\nЯ хочу, чтобы мы поговорили: Θέλω ___ μιλήσουμε=να\nГоворю тебе прийти: Σου λέω ___ έρθεις=να\nОн спросил, где я живу: Ρώτησε ___ μένω=πού\nЯ не знаю, когда это начинается: Δεν ξέρω ___ ξεκινάει=πότε\nОн спросил, чего я хочу: Ρώτησε ___ θέλω=τι\nОн сказал, что не может: Είπε ___ δεν μπορεί=ότι\nОн велел мне ждать: Μου είπε ___ περιμένω=να\nЯ спрашиваю себя, придёт ли он: Αναρωτιέμαι ___ θα έρθει=αν\nЯ хочу узнать, кто учитель: Θέλω να μάθω ___ είναι ο δάσκαλος=ποιος\nЯ сказал, что не уйду: Είπα ___ δεν θα φύγω=ότι`),
14:Q(`в школу: σε + το σχολείο →=στο σχολείο\nв море: σε + η θάλασσα →=στη θάλασσα|στην θάλασσα\nна дорогу: σε + ο δρόμος →=στον δρόμο\nк друзьям: σε + οι φίλοι →=στους φίλους\nв дома: σε + τα σπίτια →=στα σπίτια\nв Грецию: σε + η Ελλάδα →=στην Ελλάδα\nв Афины: σε + η Αθήνα →=στην Αθήνα\nв книгу: σε + το βιβλίο →=στο βιβλίο\nк отцу: σε + ο πατέρας →=στον πατέρα\nот учителя: από + ο δάσκαλος →=από τον δάσκαλο\nдля мамы: για + η μητέρα →=για τη μητέρα|για την μητέρα\nбез друга: χωρίς + ο φίλος →=χωρίς τον φίλο\nс ребёнком: με + το παιδί →=με το παιδί\nс друзьями: με + οι φίλοι →=με τους φίλους\nдля детей: για + τα παιδιά →=για τα παιδιά`),
15:Q(`Я ухожу, чтобы работать: Φεύγω ___ ___ δουλέψω=για να\nЯ не вышел, потому что шёл дождь: Δεν βγήκα ___ έβρεχε=επειδή|γιατί\nХотя идёт дождь, я выйду: ___ βρέχει, θα βγω=αν και|παρόλο που\nКнига, которую я читаю: Το βιβλίο ___ διαβάζω=που\nЯ приду, если только не пойдёт дождь: Θα έρθω, ___ ___ βρέξει=εκτός αν\nЖенщина, которая живёт здесь: Η γυναίκα ___ μένει εδώ=που\nНапишите по-гречески: как дела?=τι κάνεις\nНапишите по-гречески: хорошо, ладно=εντάξει\nНапишите по-гречески: как скажешь=ό,τι πεις\nНапишите по-гречески: извините=με συγχωρείς\nНапишите по-гречески: добрый вечер=καλησπέρα\nНапишите по-гречески: большое спасибо=ευχαριστώ πολύ\nНапишите по-гречески: пожалуйста=παρακαλώ\nНапишите по-гречески: привет, пока=γεια\nНапишите по-гречески: не понимаю=δεν καταλαβαίνω`)
};
const ex=i=>L[i][3].concat(X[i]||[]);
const go=t=>{T=t;C=null;draw()};
const lvSel=(cur,fn)=>`<select class="ip" style="width:auto;margin:0" onchange="${fn}"><option value="">Все уровни</option>${LV.map((n,i)=>`<option value="${i}" ${String(cur)===String(i)?'selected':''}>${n}</option>`).join('')}</select>`;
const mods=f=>M.map((m,mi)=>`<h2 class="font-bold mt-4 mb-2">Модуль ${mi+1}: ${m}</h2>`+L.map((l,i)=>l[0]==mi?f(l,i):'').join('')).join('');

function draw(){
  $('nav').innerHTML=tabs.map(t=>`<button onclick="go('${t[0]}')" class="rounded py-2 ${T==t[0]?'bg-white text-blue-700 font-bold':'bg-blue-500'}">${t[1]}</button>`).join('');
  const v=$('v');
  if(T=='l'){
    if(C===null){
      v.innerHTML=`<p class="mu text-sm">Проходите уроки по порядку. В каждом: короткая теория и задания, где ответ вводится только с клавиатуры (включите греческую раскладку). Регистр и ударения не учитываются.</p>`+mods((l,i)=>`<button onclick="C=${i};draw();scrollTo(0,0)" class="cd w-full text-left flex justify-between"><span>${i+1}. ${l[1]}</span><span class="ok">${P.l[i]!=null?P.l[i]+'%':''}</span></button>`);
    }else{
      const l=L[C];
      v.innerHTML=`<button onclick="C=null;draw()" class="ac">← К списку уроков</button><h2 class="text-xl font-bold my-2">${C+1}. ${l[1]}</h2><div class="cd th">${l[2]}</div><h3 class="font-bold my-2">Практика</h3>`+
      ex(C).map(e=>`<div class="mb-3"><div>${e[0]}</div><input class="ip" lang="el" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="text-sm er mt-1"></div></div>`).join('')+
      `<button onclick="chk()" class="bt">Проверить</button> <span id="sc" class="ml-2 font-bold"></span>`;
    }
  }else if(T=='t'){
    v.innerHTML='<p class="mu text-sm">Справочник: все таблицы в одном месте для быстрого поиска. Объяснения, правила и примеры смотрите в уроках.</p>'+TB.map((t,k)=>'<h3 class="font-bold mt-4">'+t[0]+'</h3>'+tbl(k)).join('');
  }else if(T=='w'){
    v.innerHTML=`<div class="flex gap-2 mb-2">${lvSel(VF,"VF=this.value;vl()")}<input class="ip" style="margin:0" placeholder="Поиск…" value="${VS}" oninput="VS=this.value;vl()"></div><button onclick="rall()" class="er text-sm mb-2">Сбросить весь прогресс словаря</button><div id="vl"></div>`;
    vl();
  }else{
    if(!TW)pk();
    v.innerHTML=`<div class="mb-3">${lvSel(TF,"TF=this.value;pk();draw()")}</div><div class="cd text-center"><div class="mu text-sm">${LV[TW[3]]} · верных ответов: ${P.w[TW[0]]||0}</div><div class="text-2xl font-bold my-3">${TW[1]}</div><p class="text-sm mu">Напишите по-гречески:</p><input id="ti" class="ip" lang="el" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')ck()"><div id="hd" class="my-2"></div><div class="flex gap-2 justify-center mb-2"><button onclick="hint()" class="bt">Открыть букву</button><button onclick="trs()" class="bt">Транскрипция</button></div><div id="tr" class="my-2 min-h-[1.5rem] font-medium"></div><button id="tb" onclick="ck()" class="bt">Проверить</button></div>`;
    AN=false;$('ti').focus();sh();
  }
}
function chk(){
  const E=ex(C);let ok=0;
  document.querySelectorAll('#v input').forEach((n,i)=>{
    const g=cmp(n.value,E[i][1]);ok+=g?1:0;
    n.style.borderColor=g?'#22c55e':'#ef4444';
    n.nextElementSibling.textContent=g?'':'Правильно: '+E[i][1].split('|')[0];
  });
  const p=Math.round(ok/E.length*100);
  P.l[C]=Math.max(P.l[C]||0,p);sv();
  $('sc').textContent='Результат: '+ok+' из '+E.length;
}
function vl(){
  const q=N(VS);
  $('vl').innerHTML=W.filter(w=>(VF===''||w[3]==VF)&&(!q||N(w[0]).includes(q)||N(w[1]).includes(q)||N(w[2]).includes(q))).map(w=>{
    const c=P.w[w[0]]||0;
    return `<div class="cd flex justify-between items-center"><div><span class="text-lg font-bold">${w[0]}</span> <span class="mu text-sm">[${w[2]}]</span><div>${w[1]}</div><div class="text-xs ac">${LV[w[3]]}</div></div><div class="text-right"><div class="${c?'ok':'mu'} font-bold">✓ ${c}</div><button onclick="rw('${w[0]}')" class="text-xs er">сбросить</button></div></div>`;
  }).join('')||'<p class="mu">Ничего не найдено</p>';
}
function rw(g){delete P.w[g];sv();vl()}
function rall(){if(confirm('Сбросить прогресс по всем словам?')){P.w={};sv();vl()}}
function pk(){
  const a=W.filter(w=>TF===''||w[3]==TF);
  const m=Math.min(...a.map(w=>P.w[w[0]]||0));
  const b=a.filter(w=>(P.w[w[0]]||0)<=m+1);
  TW=b[Math.random()*b.length|0];HN=0;HS=false;HU=false;
}
function ck(){
  if(AN){pk();draw();return}
  const g=cmp($('ti').value,TW[0]);
  if(g){if(!HU){P.w[TW[0]]=(P.w[TW[0]]||0)+1;sv()}$('tr').innerHTML='<span class="ok">✓ Верно! '+TW[0]+' ['+TW[2]+']</span>'+(HU?' <span class="mu">(с подсказкой — не засчитано)</span>':'')}
  else $('tr').innerHTML='<span class="er">✗ Правильно: '+TW[0]+' ['+TW[2]+']</span>';
  AN=true;$('tb').textContent='Далее';
}
function sh(){const h=$('hd');if(!h)return;h.innerHTML='<div class="text-xl font-bold tracking-widest">'+[...TW[0]].map((c,i)=>i<HN?c:'_').join(' ')+'</div>'+(HS?'<div class="mu">['+TW[2]+']</div>':'')}
function hint(){if(AN)return;HU=true;HN=Math.min(HN+1,[...TW[0]].length);sh()}
function trs(){if(AN)return;HU=true;HS=true;sh()}
draw();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
